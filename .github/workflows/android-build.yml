name: Android CI

on:
  push:
    branches: [ "ana" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HelalGuard_Android_Project

    steps:
    - name: Kodlari Depodan Cek
      uses: actions/checkout@v4

    - name: JDK Kurulumu (Java 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Wrapper Izinlerini Ayarla
      run: chmod +x gradlew

    - name: Projeyi Derle (Debug APK)
      run: ./gradlew assembleDebug

    - name: Derlenen APK'yi Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: HelalGuard_Android_Project/app/build/outputs/apk/debug/app-debug.apk
